# A generic, single database configuration.

[alembic]
# template used to generate migration files
# Arquivos nomeados com a data, para ficarem em ordem: 20260925_ab12cd_modelo_inicial.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

# O logger raiz fica SEM saída própria: as migrações rodam dentro da plataforma, e
# um handler aqui passaria a formatar também as mensagens do servidor (Werkzeug).
[logger_root]
level = WARN
handlers =
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers = console
qualname = alembic
propagate = 0

[logger_flask_migrate]
level = WARN
handlers = console
qualname = flask_migrate
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
