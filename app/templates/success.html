{% extends "base.html" %}

{% block title %}Projeto Criado{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 80px auto; text-align: center;">
    <div style="background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 30px; border-radius: 8px; margin-bottom: 30px;">
        <h2 style="margin-top: 0; font-size: 28px;">✅ Projeto Criado com Sucesso!</h2>
        <p style="font-size: 18px; margin: 15px 0;">{{ message }}</p>
    </div>
    
    <div style="display: flex; gap: 10px; justify-content: center;">
        <a href="/annotate/{{ project_id }}" style="background: #6f4e37; color: white; padding: 12px 30px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block;">
            ✏️ Ir para Anotação
        </a>
        <a href="/" style="background: #666; color: white; padding: 12px 30px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block;">
            📋 Voltar aos Projetos
        </a>
    </div>
</div>
{% endblock %}
