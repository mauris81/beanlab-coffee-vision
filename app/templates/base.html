<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BeanLab Coffee Vision{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('web.inicio') }}" class="brand" aria-label="Página inicial">
                <span class="brand-icon" aria-hidden="true">☕</span>
                <span>
                    <strong>BeanLab Coffee Vision</strong>
                    <small>Segmentação e anotação de amostras de café</small>
                </span>
            </a>
        </div>
    </nav>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p>Plataforma de apoio à segmentação, anotação e classificação de amostras de café.</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
